<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>基金账本管理</title>
<style>
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --text: rgba(28,28,30,1);
  --text-2: rgba(60,60,67,0.6);
  --text-3: rgba(60,60,67,0.3);
  --accent: #007AFF;
  --accent-l: rgba(0,122,255,0.1);
  --border: rgba(60,60,67,0.12);
  --up: #C40909;
  --down: #00AA11;
  --radius: 14px;
  --radius-s: 10px;
  --radius-xs: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-m: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1C1C1E;
    --text: rgba(235,235,245,1);
    --text-2: rgba(235,235,245,0.6);
    --text-3: rgba(235,235,245,0.3);
    --accent: #0A84FF;
    --accent-l: rgba(10,132,255,0.15);
    --border: rgba(84,84,88,0.65);
    --up: #FF453A;
    --down: #30D158;
    --shadow: none;
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.4);
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
header.page {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
header.page h1 { font-size: 1.2rem; font-weight: 700; }
header.page .sub { font-size: 0.75rem; color: var(--text-2); margin-top: 2px; }

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 20px;
  margin-bottom: 16px;
}
.card h2 { font-size: 0.95rem; font-weight: 600; margin-bottom: 12px; }
.card h2 .step {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent-l); color: var(--accent);
  font-size: 0.75rem; font-weight: 700; margin-right: 8px;
  vertical-align: middle;
}
.hint { font-size: 0.75rem; color: var(--text-2); margin-top: 8px; }
.hint b { color: var(--text); font-weight: 600; }

.btn {
  appearance: none; border: none; cursor: pointer;
  font-family: var(--font); font-size: 0.85rem; font-weight: 600;
  height: 38px; padding: 0 18px; border-radius: var(--radius-s);
  background: var(--accent); color: #fff;
  transition: opacity 0.15s, transform 0.1s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.btn.secondary {
  background: var(--card); color: var(--accent);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.btn.block { width: 100%; }
.btn.sm { height: 32px; padding: 0 14px; font-size: 0.8rem; }

input[type="password"], input[type="text"], input[type="email"] {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  background: var(--bg);
  color: var(--text);
  font-size: 0.95rem;
  font-family: var(--font);
  transition: border-color 0.2s, box-shadow 0.2s;
}
input[type="password"]:focus, input[type="text"]:focus, input[type="email"]:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-l);
}
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 0.75rem; color: var(--text-2); font-weight: 500; margin-bottom: 5px; }

.err { font-size: 0.78rem; color: var(--up); margin-top: 10px; min-height: 18px; }
.ok-msg { font-size: 0.78rem; color: var(--down); margin-top: 10px; }

textarea {
  width: 100%; min-height: 160px; resize: vertical;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-m); font-size: 0.78rem; line-height: 1.6;
}
textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-l); }

.file-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.file-row input[type="file"] { display: none; }

.stats-bar {
  display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0;
}
.stat {
  flex: 1; min-width: 100px;
  background: var(--bg); border-radius: var(--radius-xs);
  padding: 10px 12px; text-align: center;
}
.stat .v { font-size: 1.1rem; font-weight: 700; font-family: var(--font-m); }
.stat .l { font-size: 0.68rem; color: var(--text-2); margin-top: 2px; }
.stat.warn .v { color: var(--up); }

table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
th { font-size: 0.7rem; color: var(--text-2); font-weight: 500; white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--font-m); }
tr:last-child td { border-bottom: none; }
.user-row td { cursor: default; }
.fund-subtable { margin: 6px 0 2px 10px; }
.fund-subtable td { font-size: 0.75rem; color: var(--text-2); padding: 4px 10px; }
.pos { color: var(--up); }
.neg { color: var(--down); }
.muted { color: var(--text-3); }
code.inline {
  font-family: var(--font-m); font-size: 0.78rem;
  background: var(--accent-l); color: var(--accent);
  padding: 1px 6px; border-radius: 4px;
}
.error-list, .warn-list { font-size: 0.78rem; }
.error-list li { color: var(--up); margin: 4px 0; list-style: none; }
.warn-list li { color: var(--text-2); margin: 4px 0; list-style: none; }

.result-panel {
  background: var(--bg); border-radius: var(--radius-xs);
  padding: 14px 16px; font-size: 0.85rem;
}
.result-panel .row { display: flex; justify-content: space-between; padding: 3px 0; }
.result-panel .row .k { color: var(--text-2); }
.result-panel .row .v { font-family: var(--font-m); font-weight: 600; }

.loading { text-align: center; color: var(--text-2); font-size: 0.8rem; padding: 14px 0; }

#loginCard .logo {
  width: 52px; height: 52px; border-radius: 14px;
  background: var(--accent-l); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; margin: 0 auto 14px;
}
#loginCard { text-align: center; padding-top: 34px; padding-bottom: 30px; }

.tag {
  display: inline-block; font-size: 0.68rem; padding: 1px 8px;
  border-radius: 20px; background: var(--accent-l); color: var(--accent);
  font-weight: 600; margin-left: 6px;
}
.tag.warn { background: rgba(200,9,9,0.1); color: var(--up); }

.actions-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.divider { height: 1px; background: var(--border); margin: 14px 0; }

@media (max-width: 480px) {
  .card { padding: 14px 16px; }
  .stat { min-width: 84px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>基金账本管理</h1>
      <div class="sub">上传 CSV，一键同步全部用户持仓</div>
    </div>
    <button class="btn secondary sm" id="exitBtn" style="display:none">退出管理</button>
  </header>

  <!-- ① 管理员登录（Firebase Authentication 邮箱密码账号） -->
  <div class="card" id="loginCard">
    <div class="logo">🔐</div>
    <h2 style="text-align:center">管理员登录</h2>
    <div class="field" style="max-width:320px;margin:14px auto 0">
      <input type="email" id="adminEmail" placeholder="管理员邮箱" autocomplete="username">
    </div>
    <div class="field" style="max-width:320px;margin:10px auto 0">
      <input type="password" id="adminPwd" placeholder="密码" autocomplete="current-password">
    </div>
    <button class="btn block" id="adminLoginBtn" style="max-width:320px;margin:12px auto 0">登 录</button>
    <p class="err" id="adminLoginErr"></p>
    <p class="hint" style="margin-top:16px">管理员账号在 Firebase 控制台 → Authentication 中创建（见 DEPLOY.md）</p>
  </div>

  <!-- 工作区 -->
  <div id="workspace" style="display:none">

    <!-- ② CSV 导入 -->
    <div class="card">
      <h2><span class="step">1</span>导入 CSV</h2>
      <div class="field">
        <label>粘贴 CSV 内容（或选择文件）</label>
        <textarea id="csvText" placeholder="校验码,称呼,基金代码,持有份额,成本单价&#10;A1B2C3,老王,005827,12000,1.85&#10;A1B2C3,老王,161725,8000,0.95&#10;K9M8N7,小李,110022,5000,3.20"></textarea>
      </div>
      <div class="file-row">
        <button class="btn secondary sm" id="chooseFileBtn">选择 CSV 文件</button>
        <button class="btn secondary sm" id="tplBtn">下载模板</button>
        <input type="file" id="csvFile" accept=".csv,.txt">
        <span class="hint" id="fileInfo" style="margin-top:0"></span>
      </div>
      <p class="hint">
        每行 = 某人的一只基金。<b>成本单价</b>（份额 × 单价 = 成本）或 <b>成本金额</b>（直接填总投入）二选一，以表头第 5 列为准。
        支持自动识别 Excel 导出的 GBK 编码文件。
      </p>
    </div>

    <!-- ③ 解析预览 -->
    <div class="card" id="previewCard" style="display:none">
      <h2><span class="step">2</span>解析预览</h2>
      <div class="stats-bar" id="previewStats"></div>
      <div id="previewBody"><div class="loading">解析中...</div></div>
      <p class="hint" id="previewHint"></p>
    </div>

    <!-- ④ 一键同步 -->
    <div class="card" id="syncCard" style="display:none">
      <h2><span class="step">3</span>同步到线上</h2>
      <div class="actions-row">
        <button class="btn" id="syncBtn">一键同步</button>
        <button class="btn secondary" id="refreshStatusBtn">查看当前状态</button>
      </div>
      <div id="syncResult" style="margin-top:14px"></div>
      <p class="hint">同步立即写入 Firestore；已打开页面的用户最迟 <b>60 秒</b> 内自动拿到新持仓，新用户立即生效。</p>
    </div>

    <!-- ⑤ 当前状态 -->
    <div class="card" id="statusCard" style="display:none">
      <h2>当前线上状态</h2>
      <div id="statusBody"><div class="loading">加载中...</div></div>
    </div>

  </div>
</div>

<!-- Firebase compat SDK（Auth 管理员登录 + Firestore 读写） -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
(function() {
'use strict';

/* ==================== 配置 ==================== */
var COLLECTION = 'ledgers';   // Firestore 集合名（与 firestore.rules 一致）
var PROBE_CODE = 'probe____________________________________________________________';  // 主页面探测文档 ID，不属于任何用户，状态/同步时忽略
var MAX_CSV_BYTES = 900 * 1024;  // CSV 大小上限（与 v2 一致）

var state = {
  csv: '',          // 当前 CSV 文本
  preview: null     // 最近一次预览结果
};

var $ = function(id) { return document.getElementById(id); };

// 配置守卫：firebase-config.js 未填写 → 提示部署
function isConfigured() {
  var c = (typeof FIREBASE_CONFIG !== 'undefined') ? FIREBASE_CONFIG : null;
  return !!(c && c.apiKey && String(c.apiKey).indexOf('在此粘贴') < 0);
}

var db = null;

/* ==================== CSV 解析（自 v2 边缘函数移植，逻辑完全一致） ==================== */

// 单行解析(支持带引号字段,引号内可含逗号,转义双引号 "")
function parseCSVLine(line) {
  var fields = [];
  var cur = '';
  var inQuotes = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else { inQuotes = false; }
      } else { cur += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { fields.push(cur); cur = ''; }
      else { cur += ch; }
    }
  }
  fields.push(cur);
  return fields;
}

function isFiniteNum(v) {
  return typeof v === 'number' && isFinite(v);
}

// 解析整份 CSV → { ok, mode, users:[{code,nick,funds:[{code,shares,cost}]}], errors:[], warnings:[] }
function parseCSV(text) {
  var errors = [];
  var warnings = [];
  var users = [];           // [{code, nick, funds:[{code,shares,cost}]}]
  var userMap = {};         // code -> users 下标
  var fundMap = {};         // code -> { fundCode -> true }
  var mode = '';            // 'price' | 'amount'

  if (typeof text !== 'string' || text.replace(/\s/g, '') === '') {
    return { ok: false, fatal: 'CSV 内容为空' };
  }

  text = text.replace(/^\uFEFF/, '');
  var lines = text.split(/\r\n|\r|\n/);
  // 去掉尾部空行
  while (lines.length > 0 && lines[lines.length - 1].trim() === '') lines.pop();

  if (lines.length === 0) {
    return { ok: false, fatal: 'CSV 内容为空' };
  }

  // 表头
  var header = parseCSVLine(lines[0]).map(function(f) { return f.trim(); });
  if (header.length < 5) {
    return { ok: false, fatal: '表头至少需要 5 列（校验码,称呼,基金代码,持有份额,成本单价/成本金额），当前 ' + header.length + ' 列' };
  }
  var h5 = header[4];
  if (h5.indexOf('单价') >= 0) { mode = 'price'; }
  else if (h5.indexOf('金额') >= 0) { mode = 'amount'; }
  else {
    return { ok: false, fatal: '第 5 列表头须为「成本单价」或「成本金额」，当前为「' + (h5 || '(空)') + '」' };
  }
  // 前 4 列宽松校验(不符给 warning 不阻断)
  var expectHeader = ['校验码', '称呼', '基金代码', '持有份额'];
  for (var hi = 0; hi < 4; hi++) {
    if (header[hi].indexOf(expectHeader[hi]) < 0) {
      warnings.push({ line: 1, msg: '表头第 ' + (hi + 1) + ' 列建议为「' + expectHeader[hi] + '」，当前为「' + (header[hi] || '(空)') + '」' });
    }
  }

  if (lines.length < 2) {
    return { ok: false, fatal: 'CSV 没有数据行' };
  }

  for (var li = 1; li < lines.length; li++) {
    var raw = lines[li];
    if (raw.trim() === '') continue;
    var lineNo = li + 1;
    var cols = parseCSVLine(raw).map(function(f) { return f.trim(); });

    if (cols.length < 5) {
      errors.push({ line: lineNo, raw: raw, msg: '列数不足（需 5 列，当前 ' + cols.length + ' 列）' });
      continue;
    }

    var code = cols[0];
    var nick = cols[1];
    var fundCode = cols[2];
    var shares = parseFloat(cols[3]);
    var fifth = parseFloat(cols[4]);

    // 校验码:Firestore 文档 ID 仅支持此字符集(字母数字下划线,≤64 位)
    if (!/^[A-Za-z0-9_]{1,64}$/.test(code)) {
      errors.push({ line: lineNo, raw: raw, msg: '校验码「' + code + '」非法（仅限字母、数字、下划线，1-64 位）' });
      continue;
    }
    if (nick.length > 32) {
      errors.push({ line: lineNo, raw: raw, msg: '称呼过长（最多 32 字）' });
      continue;
    }
    if (!/^\d{6}$/.test(fundCode)) {
      errors.push({ line: lineNo, raw: raw, msg: '基金代码「' + fundCode + '」非法（须为 6 位数字）' });
      continue;
    }
    if (!isFiniteNum(shares) || shares <= 0) {
      errors.push({ line: lineNo, raw: raw, msg: '持有份额「' + cols[3] + '」非法（须为正数）' });
      continue;
    }
    var cost;
    if (mode === 'price') {
      if (!isFiniteNum(fifth) || fifth <= 0) {
        errors.push({ line: lineNo, raw: raw, msg: '成本单价「' + cols[4] + '」非法（须为正数）' });
        continue;
      }
      cost = Math.round(shares * fifth * 100) / 100;
    } else {
      if (!isFiniteNum(fifth) || fifth < 0) {
        errors.push({ line: lineNo, raw: raw, msg: '成本金额「' + cols[4] + '」非法（须为非负数）' });
        continue;
      }
      cost = Math.round(fifth * 100) / 100;
    }

    // 同一校验码多行 → 合并
    var ui = userMap[code];
    if (ui === undefined) {
      users.push({ code: code, nick: nick, funds: [{ code: fundCode, shares: shares, cost: cost }] });
      userMap[code] = users.length - 1;
      fundMap[code] = {};
      fundMap[code][fundCode] = true;
    } else {
      if (users[ui].nick !== nick) {
        warnings.push({ line: lineNo, msg: '校验码 ' + code + ' 的称呼不一致（' + users[ui].nick + ' / ' + nick + '），以先出现者为准' });
      }
      if (fundMap[code][fundCode]) {
        errors.push({ line: lineNo, raw: raw, msg: '校验码 ' + code + ' 下基金 ' + fundCode + ' 重复' });
        continue;
      }
      users[ui].funds.push({ code: fundCode, shares: shares, cost: cost });
      fundMap[code][fundCode] = true;
    }
  }

  if (users.length === 0 && errors.length === 0) {
    return { ok: false, fatal: 'CSV 没有有效数据行' };
  }

  return { ok: true, mode: mode, users: users, errors: errors, warnings: warnings };
}

/* ==================== ① 登录（Firebase Auth 邮箱密码） ==================== */

// Auth 错误码 → 中文提示
function authErrMsg(e) {
  var code = (e && e.code) || '';
  var map = {
    'auth/invalid-email': '邮箱格式不正确',
    'auth/user-not-found': '邮箱或密码错误',
    'auth/wrong-password': '邮箱或密码错误',
    'auth/invalid-credential': '邮箱或密码错误',
    'auth/too-many-requests': '尝试过于频繁，请稍后再试',
    'auth/network-request-failed': '网络异常，请检查网络后重试',
    'auth/operation-not-allowed': 'Firebase 控制台未启用「邮箱/密码」登录方式',
    'auth/unauthorized-domain': '当前域名未加入 Firebase 授权域名（见 DEPLOY.md）',
    'auth/invalid-api-key': 'firebase-config.js 中的 apiKey 无效，请核对'
  };
  return map[code] || (e && e.message) || '登录失败';
}

function doAdminLogin() {
  var email = ($('adminEmail').value || '').trim();
  var pwd = $('adminPwd').value;
  if (!email) { $('adminLoginErr').textContent = '请输入管理员邮箱'; return; }
  if (!pwd) { $('adminLoginErr').textContent = '请输入密码'; return; }
  $('adminLoginErr').textContent = '';
  $('adminLoginBtn').disabled = true;
  $('adminLoginBtn').textContent = '登录中...';
  firebase.auth().signInWithEmailAndPassword(email, pwd).then(function(userCred) {
    var user = userCred.user;
    // 邮箱核对：仅允许 firebase-config.js 中配置的管理员邮箱
    if (typeof ADMIN_EMAIL !== 'undefined' && String(ADMIN_EMAIL).indexOf('在此粘贴') < 0
        && user.email !== ADMIN_EMAIL) {
      firebase.auth().signOut();
      throw { code: 'not-admin', email: user.email };
    }
    // 登录成功 → onAuthStateChanged 负责切换视图
  }).catch(function(e) {
    if (e && e.code === 'not-admin') {
      $('adminLoginErr').textContent = '此账号（' + (e.email || '') + '）不是管理员账号，请核对 firebase-config.js 中的 ADMIN_EMAIL';
    } else {
      $('adminLoginErr').textContent = authErrMsg(e);
    }
  }).then(function() {
    $('adminLoginBtn').disabled = false;
    $('adminLoginBtn').textContent = '登 录';
  });
}

// 会话状态：已登录直接进工作区（浏览器本会话记住登录态，刷新免重输）
function initAuth() {
  if (!isConfigured()) {
    $('adminLoginErr').textContent = '尚未配置 Firebase：请按 DEPLOY.md 填写 firebase-config.js 后重新部署';
    $('adminLoginBtn').disabled = true;
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(function(user) {
    if (user) {
      var isAdminEmail = (typeof ADMIN_EMAIL !== 'undefined' && String(ADMIN_EMAIL).indexOf('在此粘贴') < 0)
        ? (user.email === ADMIN_EMAIL)
        : true;  // 未配置 ADMIN_EMAIL 时不做客户端拦截，交由 Firestore 规则把关
      if (!isAdminEmail) { firebase.auth().signOut(); return; }
      $('loginCard').style.display = 'none';
      $('workspace').style.display = 'block';
      $('exitBtn').style.display = 'inline-flex';
      loadStatus();
    } else {
      $('loginCard').style.display = 'block';
      $('workspace').style.display = 'none';
      $('exitBtn').style.display = 'none';
      $('adminPwd').value = '';
    }
  });
}

// Firestore 权限错误统一提示（规则未发布 / 邮箱与规则不一致时出现）
function fsErr(e) {
  var msg = (e && e.code === 'permission-denied')
    ? 'Firestore 拒绝访问：请确认已发布 firestore.rules，且规则中的管理员邮箱与登录邮箱一致'
    : ((e && e.message) || '操作失败');
  return msg;
}

/* ==================== ② CSV 导入 ==================== */
function readCSVFile(file) {
  var reader = new FileReader();
  reader.onload = function(ev) {
    var buf = ev.target.result;
    var text;
    try {
      text = new TextDecoder('utf-8', { fatal: true }).decode(buf);
      $('fileInfo').textContent = file.name + '（UTF-8）';
    } catch (e) {
      try {
        text = new TextDecoder('gbk').decode(buf);
        $('fileInfo').textContent = file.name + '（GBK 已自动转换）';
      } catch (e2) {
        text = new TextDecoder('utf-8').decode(buf);
        $('fileInfo').textContent = file.name;
      }
    }
    text = text.replace(/^\uFEFF/, '');
    $('csvText').value = text;
    updateCsvStats();
  };
  reader.readAsArrayBuffer(file);
}

function updateCsvStats() {
  state.csv = $('csvText').value;
  var lines = state.csv ? state.csv.split(/\r\n|\r|\n/).filter(function(l) { return l.trim() !== ''; }).length : 0;
  var kb = Math.round(new TextEncoder().encode(state.csv).length / 1024);
  var info = lines > 0 ? lines + ' 行 · ' + kb + ' KB' : '';
  if (kb > 880) info += ' · ⚠️ 接近 900KB 上限';
  $('fileInfo').textContent = info;
}

function downloadTemplate() {
  var csv = '校验码,称呼,基金代码,持有份额,成本单价\n' +
            'A1B2C3,老王,005827,12000,1.85\n' +
            'A1B2C3,老王,161725,8000,0.95\n' +
            'K9M8N7,小李,110022,5000,3.20\n';
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '基金账本模板.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ==================== ③ 解析预览（本地解析，不请求服务器） ==================== */
function fmtMoney(v) {
  return (+v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function doPreview() {
  var csv = $('csvText').value;
  if (!csv.trim()) { alert('请先粘贴 CSV 内容或选择文件'); return; }
  state.csv = csv;
  $('previewCard').style.display = 'block';
  $('syncCard').style.display = 'none';
  $('previewStats').innerHTML = '';
  $('previewBody').innerHTML = '<div class="loading">解析中...</div>';
  $('previewHint').textContent = '';

  var csvBytes = new TextEncoder().encode(csv).length;
  if (csvBytes > MAX_CSV_BYTES) {
    $('previewBody').innerHTML = '<p class="err">CSV 过大（' + Math.round(csvBytes / 1024) + 'KB，上限 900KB），请拆分或精简</p>';
    return;
  }

  // 立即本地解析（v3 起解析在浏览器完成，与 v2 服务端解析逻辑一致）
  var parsed = parseCSV(csv);
  if (!parsed.ok) {
    $('previewBody').innerHTML = '<p class="err">' + esc(parsed.fatal || '解析失败') + '</p>';
    return;
  }
  var userCount = parsed.users.length;
  var positionCount = 0;
  parsed.users.forEach(function(u) { positionCount += u.funds.length; });
  var body = {
    mode: parsed.mode,
    stats: { userCount: userCount, positionCount: positionCount, errorCount: parsed.errors.length, warningCount: parsed.warnings.length },
    users: parsed.users,
    errors: parsed.errors,
    warnings: parsed.warnings
  };
  state.preview = body;
  renderPreview(body);
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderPreview(p) {
  var s = p.stats;
  $('previewStats').innerHTML =
    '<div class="stat"><div class="v">' + s.userCount + '</div><div class="l">用户</div></div>' +
    '<div class="stat"><div class="v">' + s.positionCount + '</div><div class="l">持仓行</div></div>' +
    '<div class="stat' + (s.errorCount > 0 ? ' warn' : '') + '"><div class="v">' + s.errorCount + '</div><div class="l">错误</div></div>' +
    '<div class="stat"><div class="v">' + s.warningCount + '</div><div class="l">警告</div></div>';

  var html = '';
  // 错误列表
  if (p.errors && p.errors.length > 0) {
    html += '<h2 style="font-size:0.8rem;color:var(--up);margin:6px 0">错误（须修正后才能同步）</h2><ul class="error-list">';
    p.errors.forEach(function(e) {
      html += '<li>第 ' + e.line + ' 行：' + esc(e.msg) + '<br><span class="muted">' + esc(e.raw) + '</span></li>';
    });
    html += '</ul>';
  }
  // 警告列表
  if (p.warnings && p.warnings.length > 0) {
    html += '<div class="divider"></div><h2 style="font-size:0.8rem;color:var(--text-2);margin:6px 0">警告</h2><ul class="warn-list">';
    p.warnings.forEach(function(w) {
      html += '<li>' + esc(w.msg) + '</li>';
    });
    html += '</ul>';
  }
  // 用户表
  if (p.users && p.users.length > 0) {
    html += '<div class="divider"></div><table><thead><tr>' +
      '<th>校验码</th><th>称呼</th><th>基金</th><th class="num">总成本</th></tr></thead><tbody>';
    p.users.forEach(function(u) {
      var total = 0;
      u.funds.forEach(function(f) { total += f.cost; });
      html += '<tr class="user-row"><td><code class="inline">' + esc(u.code) + '</code></td><td>' + esc(u.nick) + '</td>' +
        '<td>' + u.funds.length + ' 只</td><td class="num">' + fmtMoney(total) + '</td></tr>';
      html += '<tr><td colspan="4" style="padding:0"><table class="fund-subtable"><tbody>';
      u.funds.forEach(function(f) {
        html += '<tr><td data-fund="' + esc(f.code) + '">' + esc(f.code) + '</td>' +
          '<td data-name="' + esc(f.code) + '" class="muted">获取名称中...</td>' +
          '<td class="num">' + (+f.shares).toLocaleString('zh-CN') + ' 份</td>' +
          '<td class="num">' + fmtMoney(f.cost) + ' 元</td></tr>';
      });
      html += '</tbody></table></td></tr>';
    });
    html += '</tbody></table>';
  }
  $('previewBody').innerHTML = html;

  // 同步卡片：有错误则禁用
  $('syncCard').style.display = 'block';
  var hasErr = p.errors && p.errors.length > 0;
  $('syncBtn').disabled = hasErr;
  $('syncBtn').textContent = hasErr ? '存在错误，无法同步' : '一键同步';
  $('previewHint').textContent = hasErr
    ? '请修正上方错误行后重新解析'
    : '成本模式：' + (p.mode === 'price' ? '成本单价（份额 × 单价）' : '成本金额（直接填总投入）');

  // 客户端带出基金名称（与主应用同一数据源）
  if (p.users && p.users.length > 0) {
    var codes = [];
    p.users.forEach(function(u) { u.funds.forEach(function(f) { if (codes.indexOf(f.code) < 0) codes.push(f.code); }); });
    fillFundNames(codes);
  }
}

// pingzhongdata JSONP 查基金名称（与主应用 fetchQuotes 同一数据源）
function fillFundNames(codes) {
  var CONCURRENCY = 6;
  var queue = codes.slice();
  var active = 0;
  function next() {
    if (queue.length === 0 && active === 0) return;
    while (active < CONCURRENCY && queue.length > 0) {
      (function(code) {
        active++;
        fetchFundName(code).then(function(name) {
          active--;
          var cells = document.querySelectorAll('[data-name="' + code + '"]');
          for (var i = 0; i < cells.length; i++) {
            cells[i].textContent = name || '⚠️ 未识别（请核对代码）';
            if (!name) cells[i].className = 'pos';
          }
          next();
        });
      })(queue.shift());
    }
  }
  next();
}

function fetchFundName(code) {
  return new Promise(function(resolve) {
    var s = document.createElement('script');
    var settled = false;
    var globals = ['fS_name','fS_code','Data_netWorthTrend','Data_grandTotalTrend','Data_fundSharesPositions','ishb','fund_sourceRate','fund_Rate','fund_minsg','stockCodes','zqCodes','stockCodesNew','zqCodesNew','syl_1n','syl_6y','syl_3y','syl_1y','Data_rateInSimilarType','Data_rateInSimilarPersent','Data_performanceEvaluation'];
    function cleanup() {
      globals.forEach(function(v) { try { delete window[v]; } catch(e) { window[v] = undefined; } });
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    var timer = setTimeout(function() {
      if (!settled) { settled = true; cleanup(); resolve(null); }
    }, 12000);
    s.onload = function() {
      if (settled) return; settled = true; clearTimeout(timer);
      var name = window.fS_name || '';
      cleanup();
      resolve(name || null);
    };
    s.onerror = function() {
      if (settled) return; settled = true; clearTimeout(timer);
      cleanup(); resolve(null);
    };
    s.src = 'https://fund.eastmoney.com/pingzhongdata/' + code + '.js';
    document.body.appendChild(s);
  });
}

/* ==================== ④ 同步（Firestore 差量写入） ==================== */
// 文档结构：ledgers/{校验码} = { nick, updated, positions:[{code,shares,cost}] }
// 与 v2 KV 的 user_<校验码> 完全同构，前端主页面无需感知版本差异。
function doSync() {
  if (!state.csv || !state.preview) return;
  var btn = $('syncBtn');
  btn.disabled = true;
  btn.textContent = '同步中...';
  $('syncResult').innerHTML = '<div class="loading">正在写入 Firestore...</div>';

  var parsed = state.preview;
  var now = new Date().toISOString();
  var newCodes = {};
  parsed.users.forEach(function(u) { newCodes[u.code] = true; });

  // 读取现有全部文档 ID → 计算"被移除的校验码"
  db.collection(COLLECTION).get().then(function(snap) {
    var oldCodes = [];
    snap.forEach(function(doc) {
      if (doc.id !== PROBE_CODE) oldCodes.push(doc.id);  // 探测文档不属于任何用户
    });
    var removed = oldCodes.filter(function(c) { return !newCodes[c]; });

    // 分批写入（Firestore 单批上限 500 次操作，按 400 一批留余量）
    var ops = [];
    parsed.users.forEach(function(u) {
      ops.push({ type: 'set', code: u.code, data: {
        nick: u.nick,
        updated: now,
        positions: u.funds.map(function(f) { return { code: f.code, shares: f.shares, cost: f.cost }; })
      }});
    });
    removed.forEach(function(c) { ops.push({ type: 'del', code: c }); });

    var batches = [];
    for (var i = 0; i < ops.length; i += 400) batches.push(ops.slice(i, i + 400));

    // 顺序提交各批次
    var p = Promise.resolve();
    batches.forEach(function(batchOps) {
      p = p.then(function() {
        var batch = db.batch();
        batchOps.forEach(function(op) {
          var ref = db.collection(COLLECTION).doc(op.code);
          if (op.type === 'set') batch.set(ref, op.data);
          else batch.delete(ref);
        });
        return batch.commit();
      });
    });
    return p.then(function() {
      var userCount = parsed.users.length;
      var positionCount = 0;
      parsed.users.forEach(function(u) { positionCount += u.funds.length; });
      return { userCount: userCount, positionCount: positionCount, removed: removed, updated: now };
    });
  }).then(function(b) {
    var html = '<div class="result-panel">' +
      '<div class="row"><span class="k">写入用户</span><span class="v">' + b.userCount + ' 人</span></div>' +
      '<div class="row"><span class="k">写入持仓</span><span class="v">' + b.positionCount + ' 行</span></div>';
    if (b.removed && b.removed.length > 0) {
      html += '<div class="row"><span class="k">移除校验码</span><span class="v" style="color:var(--up)">' +
        b.removed.map(function(c) { return esc(c); }).join('、') + '</span></div>';
    }
    html += '<div class="row"><span class="k">更新时间</span><span class="v">' + esc(b.updated || '') + '</span></div></div>' +
      '<p class="ok-msg">✓ 同步成功，约 60 秒内对全部在线用户生效</p>';
    $('syncResult').innerHTML = html;
    btn.disabled = false;
    btn.textContent = '再次同步';
    loadStatus();
  }).catch(function(e) {
    $('syncResult').innerHTML = '<p class="err">' + esc(fsErr(e)) + '</p>';
    btn.disabled = false;
    btn.textContent = '一键同步';
  });
}

/* ==================== ⑤ 状态（Firestore 集合枚举，仅管理员规则放行） ==================== */
function loadStatus() {
  $('statusCard').style.display = 'block';
  $('statusBody').innerHTML = '<div class="loading">加载中...</div>';
  db.collection(COLLECTION).get().then(function(snap) {
    var users = [];
    snap.forEach(function(doc) {
      if (doc.id === PROBE_CODE) return;  // 探测文档不属于任何用户
      var d = doc.data() || {};
      users.push({
        code: doc.id,
        nick: d.nick || '',
        fundCount: Array.isArray(d.positions) ? d.positions.length : 0,
        updated: d.updated || ''
      });
    });
    if (users.length === 0) {
      $('statusBody').innerHTML = '<p class="hint" style="margin:0">还没有任何用户数据，请先导入 CSV 并同步</p>';
      return;
    }
    users.sort(function(a, b) { return String(a.code).localeCompare(String(b.code)); });
    var html = '<table><thead><tr><th>校验码</th><th>称呼</th><th class="num">基金数</th><th>更新时间</th></tr></thead><tbody>';
    users.forEach(function(u) {
      html += '<tr><td><code class="inline">' + esc(u.code) + '</code></td><td>' + esc(u.nick) + '</td>' +
        '<td class="num">' + u.fundCount + '</td><td class="muted">' + esc(fmtTime(u.updated)) + '</td></tr>';
    });
    html += '</tbody></table>';
    $('statusBody').innerHTML = html;
  }).catch(function(e) {
    $('statusBody').innerHTML = '<p class="err">' + esc(fsErr(e)) + '</p>';
  });
}

function fmtTime(iso) {
  if (!iso) return '';
  try {
    var d = new Date(iso);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
      pad(d.getHours()) + ':' + pad(d.getMinutes());
  } catch (e) { return iso; }
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }

$('adminLoginBtn').addEventListener('click', doAdminLogin);
$('adminPwd').addEventListener('keydown', function(e) { if (e.key === 'Enter') doAdminLogin(); });
$('adminEmail').addEventListener('keydown', function(e) { if (e.key === 'Enter') $('adminPwd').focus(); });

var previewBtn = document.createElement('button');
previewBtn.className = 'btn block';
previewBtn.id = 'previewBtn';
previewBtn.textContent = '解析预览';

previewBtn.addEventListener('click', doPreview);

csvCard.appendChild(previewBtn);

initAuth();
